}

function rejectionList(rows) {
  return rows.map(r => `<div class="feed-item">
    <div><strong>${esc(r.symbol)}</strong> ${esc(r.side)} <span class="badge warn">${esc(r.verdict || "rejected")}</span> <span class="muted">${esc(when(r.occurred_at))}</span></div>
    <div class="muted">${esc((r.reasons || []).join(" · ") || "no reason recorded")}</div>
  </div>`).join("");
}

function drawSpark() {
  const canvas = document.getElementById("equitySpark");
  if (!canvas) return;
  const values = (state.equity || []).map(p => Number(p.equity)).filter(n => !Number.isNaN(n));
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 320;
  const h = canvas.clientHeight || 84;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (values.length < 2) {
    ctx.fillStyle = "#5c594e";
    ctx.font = "13px IBM Plex Sans";
    ctx.fillText("Curve appears after the paper loop records equity.", 8, h / 2);
    return;
  }
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const last = values[values.length - 1];
  const first = values[0];
  ctx.beginPath();
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * (w - 8) + 4;
    const y = h - 8 - ((v - min) / range) * (h - 16);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.strokeStyle = last >= first ? "#3ee0a2" : "#ff6a5c";
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

let lastRenderFp = "";
function viewFingerprint(name) {
  const floor = state.floor || {};
  const slices = {
    overview: { eq: state.equity, risk: state.risk, standup: floor.standup, pipeline: floor.pipeline, inboxN: (floor.inbox || []).length, golive: state.golive, paperN: (state.strategies || {}).paper_override_count, approvedN: (state.strategies || {}).approved_count },
    health: { cycle: state.cycle, llm: state.llm, risk: state.risk },
    floor: { employees: floor.employees, activity: floor.activity, org: floor.org },
    blotter: { trades: state.trades, rejections: state.rejections },
    positions: { pos: (state.risk || {}).open_positions, eq: state.equity },
    strategies: { strategies: state.strategies, integrity: floor.integrity },
    inbox: { inbox: floor.inbox, escalations: floor.escalations },
    research: { pipeline: floor.pipeline, research: floor.research, plan: floor.research_plan },
    sentiment: { sentiment: floor.sentiment, regime: floor.regime },
    gates: { golive: state.golive },
    controls: { llm: state.llm, budget: floor.budget },
  };
  return name + ":" + JSON.stringify(slices[name] || state);
}
function render(opts) {
  const keepScroll = !opts || opts.keepScroll !== false;
  const force = !!(opts && opts.force);
  const name = viewName();
  document.getElementById("pageTitle").textContent = (VIEWS.find(([id]) => id === name) || [])[1] || "Overview";
  document.getElementById("pageKicker").textContent = KICKERS[name] || "";
  renderNav();
  const killed = !!(state.risk.kill_switch && state.risk.kill_switch.tripped);
  document.getElementById("modePill").textContent = (state.risk.mode || "paper") + (killed ? " · HALTED" : "");
  document.getElementById("liveDot").className = "dot " + (lastError ? "bad" : killed ? "warn" : "ok");
  document.getElementById("liveLabel").textContent = lastError ? "API error" : killed ? "Halted" : "Live feed";
  const fp = viewFingerprint(name);
  const innerExisting = document.getElementById("viewInner");
  if (!force && keepScroll && fp === lastRenderFp && innerExisting && innerExisting.firstChild) {
    return;
  }
  lastRenderFp = fp;
  const scrolls = keepScroll ? snapshotScroll() : { view: 0, windowX: 0, windowY: 0, doc: 0 };
  const renderers = {
    overview: renderOverview,
    health: renderHealth,
    floor: renderFloor,
    blotter: renderBlotter,
    positions: renderPositions,
    strategies: renderStrategies,
    inbox: renderInbox,
    research: renderResearch,
    sentiment: renderSentiment,
    gates: renderGates,
    controls: renderControls,
  };
  const blotterQ = document.getElementById("blotterQ")?.value;
  const blotterSide = document.getElementById("blotterSide")?.value;
  const filters = snapshotFilters();
  const view = document.getElementById("view");
  let inner = document.getElementById("viewInner");
  if (!inner) {
    view.innerHTML = '<div id="viewInner"></div>';
    inner = document.getElementById("viewInner");
  }
  const active = document.activeElement;
  const activeId = active && inner.contains(active) ? active.id : "";
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  if (active && inner.contains(active) && typeof active.blur === "function") active.blur();
  inner.innerHTML = (renderers[name] || renderOverview)();
  restoreFilters(filters);
  if (name === "blotter") {
    if (blotterQ != null && document.getElementById("blotterQ")) document.getElementById("blotterQ").value = blotterQ;
    if (blotterSide != null && document.getElementById("blotterSide")) document.getElementById("blotterSide").value = blotterSide;
  }
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && typeof el.focus === "function") {
      el.focus({ preventScroll: true });
      if (selStart != null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(selStart, selEnd); } catch (err) {}
      }
    }
  }
  restoreScroll(scrolls);
  requestAnimationFrame(drawSpark);
}

function openSettings() {
  go("controls");
  setTimeout(() => document.getElementById("tokenField")?.focus(), 50);
}
function saveToken() {
  localStorage.setItem("firmApiToken", document.getElementById("tokenField").value.trim());
  toast("Token saved on this device");
  render();
}
function openKill() {
  showModal(`<div class="modal">
    <h3>Halt the firm</h3>
    <p>This trips the kill switch. New entries stop until you investigate and reset with the exact phrase.</p>
    <input class="field" id="killDetail" style="width:100%" value="manual halt from dashboard"/>
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn danger" onclick="doKill()">Trip kill switch</button>
    </div>
  </div>`);
}
async function doKill() {
  try {
    await post("/api/risk/kill", { detail: document.getElementById("killDetail").value, operator: "operator" });
    closeModal();
    toast("Kill switch tripped");
    await load(true);
  } catch (err) { toast(String(err.message || err)); }
}
function openReset() {
  showModal(`<div class="modal">
    <h3>Reset after investigation</h3>
    <p>Type the acknowledgement exactly. A reset without a cause is how the last bot pretended it had risk controls.</p>
    <input class="field" id="resetOp" style="width:100%;margin-bottom:8px" placeholder="Your name"/>
    <input class="field" id="resetAck" style="width:100%" placeholder="${RESET_PHRASE}"/>
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn accent" onclick="doReset()">Reset</button>
    </div>
  </div>`);
}
async function doReset() {
  try {
    await post("/api/risk/reset", {
      operator: document.getElementById("resetOp").value.trim() || "operator",
      acknowledgement: document.getElementById("resetAck").value,
    });
    closeModal();
    toast("Kill switch cleared");
    await load(true);
  } catch (err) { toast(String(err.message || err)); }
}
async function decide(id, approved) {
  try {
    const result = await post("/api/inbox/" + id + "/decide", { approved, decided_by: "operator", reason: "dashboard" });
    toast(typeof result.next_step === "string" ? result.next_step : (approved ? "Approved" : "Rejected"), "", 9000);
    await load(true);
  } catch (err) { toast(String(err.message || err)); }
}
async function codeFamily(family) {
  try {
    const result = await post("/api/research/code-family", { family, reason: "research_tab" });
    toast(result.next_step || "Coding started", "", 9000);
    await load(true);
  } catch (err) { toast(String(err.message || err)); }
}
async function ack(id) {
  try {
    await post("/api/escalations/" + id + "/ack", {});
    toast("Acknowledged");
    await load(true);
  } catch (err) { toast(String(err.message || err)); }
}
async function resolveEscalation(id) {
  try {
    await post("/api/escalations/" + id + "/resolve", {});
    toast("Resolved");
    await load(true);
  } catch (err) { toast(String(err.message || err)); }
}

async function pingGemini() {
  try {
    const result = await post("/api/llm/ping", { provider: "gemini" });
    state.llmPing = result;
    toast(result.ok ? "Gemini accepted the key" : (result.detail || "Gemini ping failed"));
    render();
  } catch (err) {
    toast(String(err.message || err));
  }
}

async function wakeFloor() {
  toast("Waking the floor — Gemini calls take about a minute");
  try {
    const result = await post("/api/employees/wake", {});
    const ok = (result.ran || []).filter(r => r.status === "success").length;
    const fail = (result.ran || []).filter(r => r.status !== "success").length;
    toast(`Floor ran ${ok} employee(s)` + (fail ? `, ${fail} did not finish` : "") + ((result.skipped || []).length ? `; skipped ${result.skipped.join(", ")}` : ""));
    await load(true);
  } catch (err) {
    toast(String(err.message || err));
  }
}

async function load(manual) {
  try {
    await ensureLocalToken();
    const [floor, risk, trades, golive, equity, rejections, llm, strategies, cycle] = await Promise.all([
      get("/api/floor"),
      get("/api/risk"),
      get("/api/trades?limit=100"),
      get("/api/go-live"),
      get("/api/equity?limit=240"),
      get("/api/rejections?limit=40"),
      get("/api/llm"),
      get("/api/strategies"),
      get("/api/cycle"),
    ]);
    state = { floor, risk, trades, golive, equity, rejections, llm, strategies, cycle, llmPing: state.llmPing };
    lastError = "";
    render({ keepScroll: true, force: !!manual });
  } catch (err) {
    lastError = String(err.message || err);
    if (manual) toast(lastError);
    renderNav();
    document.getElementById("liveDot").className = "dot bad";
    document.getElementById("liveLabel").textContent = "API error";
  }
}

function tickClock() {
  document.getElementById("clock").textContent = new Date().toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
window.addEventListener("hashchange", () => render({ keepScroll: false, force: true }));
window.addEventListener("resize", drawSpark);
tickClock();
setInterval(tickClock, 1000);
load();
setInterval(load, 15000);
</script>
