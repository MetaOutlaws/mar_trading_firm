# This repository had no pull-request test workflow. The only Actions
# workflows were one-shot branch publishers, so PR checks stayed empty.
# This job runs the isolated paper comparison tests on every pull request
# and push, including draft pull requests, with no path filter.
name: Cipher-forward paper

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Cipher-forward paper tests
        run: python -m pytest tests/test_cipher_forward.py tests/test_cipher_forward_runtime.py tests/test_cipher_forward_storage.py tests/test_cipher_forward_ruling.py
