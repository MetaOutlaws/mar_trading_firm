services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: python scripts/run_api.py
    env_file: .env
    # .env defaults API_HOST to 127.0.0.1. Inside the container that bind is
    # unreachable via published port 8000, so the host browser gets connection
    # refused. Force all-interfaces here; run_api.py also remaps in Docker.
    environment:
      API_HOST: "0.0.0.0"
    ports:
      - "8000:8000"

  paper:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: python scripts/run_paper_trading.py
    env_file: .env
    depends_on:
      - api
