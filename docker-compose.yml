services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: python scripts/run_api.py
    env_file: .env
    ports:
      - "8000:8000"

  paper:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: python scripts/run_paper_trading.py
    env_file: .env
    depends_on:
      - api
